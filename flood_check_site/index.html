<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kustöversvämnings Kollen</title>
<meta name="description" content="Se hur utsatt en svensk adress är för översvämning från havet och från Vänern. Bygger på MSB:s översvämningskartering.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f2b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=20260925m">
</head>
<body class="landing">

<main id="map" data-i18n-aria="map.aria"></main>

<!-- Top bar: shown after the first search -->
<header class="topbar">
  <div class="wordmark">
    <svg class="drop" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c5 7 9 11.5 9 16a9 9 0 0 1-18 0c0-4.5 4-9 9-16z"/><path class="wave" d="M8 21c2.5 1.6 5.2 1.6 8 0s5.5-1.6 8 0"/></svg>
    <span data-i18n="brand">Kustöversvämnings Kollen</span>
  </div>
  <div id="barSearch" class="bar-search"></div>
  <div class="bar-actions">
    <div class="lang" role="group" data-i18n-aria="lang.label">
      <button type="button" data-lang="sv" lang="sv">SV</button><button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <button type="button" class="icon-btn" id="btnAbout" data-i18n-aria="about.open" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6"/><circle cx="12" cy="16.8" r=".6" class="fill"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btnSettings" data-i18n-aria="settings.open" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>


<!-- The tide gauge: the water level control -->
<section id="gauge" class="gauge" hidden>
  <output id="gaugeRead" class="gauge-read">+0,2 m</output>
  <div id="gaugeBoard" class="gauge-board" role="slider" tabindex="0" data-i18n-aria="gauge.aria"></div>
  <button type="button" id="gaugePlay" class="gauge-play" data-i18n-aria="ex.playAria">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="i-play"><path d="M8 5.5v13l10.5-6.5z"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>
  <p class="gauge-hint" id="gaugeHint"></p>
</section>

<div id="depthKey" class="depth-key" hidden></div>



<!-- One drawer, three contents: details, about, settings -->
<aside id="drawer" class="drawer" hidden aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <button type="button" class="icon-btn" id="drawerClose" data-i18n-aria="drawer.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="pane" id="paneDetails" hidden></div>

  <div class="pane" id="paneAbout" hidden>
    <p data-i18n="intro.p1"></p>
    <p data-i18n="intro.p2"></p>
    <p data-i18n="intro.p3"></p>
    <h3 data-i18n="about.how"></h3>
    <p data-i18n="about.howText"></p>
    <h3 data-i18n="about.sources"></h3>
    <p class="fine" data-i18n="foot.data"></p>
    <p class="fine" data-i18n="foot.disclaimer"></p>
  </div>

  <div class="pane" id="paneSettings" hidden>
    <fieldset class="set">
      <legend data-i18n="settings.base"></legend>
      <label class="radio"><input type="radio" name="base" value="osm" checked> <span data-i18n="base.osm"></span></label>
      <label class="radio"><input type="radio" name="base" value="sat"> <span data-i18n="base.sat"></span></label>
    </fieldset>
    <fieldset class="set">
      <legend data-i18n="adv.style"></legend>
      <div class="seg" role="radiogroup" data-i18n-aria="adv.style">
        <button type="button" data-style="level" aria-checked="true" role="radio" data-i18n="adv.byDepth"></button>
        <button type="button" data-style="single" aria-checked="false" role="radio" data-i18n="adv.oneColour"></button>
      </div>
      <label class="slider"><span><span data-i18n="adv.opacity"></span> <output id="opOut">70 %</output></span>
        <input id="opacity" type="range" min="20" max="100" step="5" value="70"></label>
    </fieldset>

    <details class="set-more">
      <summary data-i18n="adv.summary"></summary>
      <section id="layers">
        <div class="ly-group" data-sys="coast">
          <div class="ly-row">
            <label class="ly-all"><input type="checkbox" id="allCoast" checked> <span data-i18n="adv.coast"></span></label>
            <span class="ly-count" id="cntCoast"></span>
          </div>
          <label class="slider"><span><span data-i18n="adv.upTo"></span> <output id="upCoastOut">+5,0 m</output></span>
            <input id="upCoast" type="range" min="1" max="50" step="1" value="50"></label>
          <div class="chips" id="chipsCoast" role="group" data-i18n-aria="adv.chips.coast"></div>
        </div>
        <div class="ly-group" data-sys="vanern">
          <div class="ly-row">
            <label class="ly-all"><input type="checkbox" id="allVanern" checked> <span data-i18n="adv.van"></span></label>
            <span class="ly-count" id="cntVanern"></span>
          </div>
          <label class="slider"><span><span data-i18n="adv.upTo"></span> <output id="upVanernOut">48,0 m</output></span>
            <input id="upVanern" type="range" min="1" max="20" step="1" value="20"></label>
          <div class="chips chips-v" id="chipsVanern" role="group" data-i18n-aria="adv.chips.van"></div>
        </div>
        <p class="fine" data-i18n="adv.hint"></p>
      </section>
    </details>
  </div>
</aside>

<!-- Landing: address first -->
<div id="landing" class="landing-screen" role="dialog" aria-modal="true" aria-labelledby="landTitle">
  <div class="landing-top">
    <div class="wordmark">
      <svg class="drop" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c5 7 9 11.5 9 16a9 9 0 0 1-18 0c0-4.5 4-9 9-16z"/><path class="wave" d="M8 21c2.5 1.6 5.2 1.6 8 0s5.5-1.6 8 0"/></svg>
      <span data-i18n="brand">Kustöversvämnings Kollen</span>
    </div>
    <div class="lang" role="group" data-i18n-aria="lang.label">
      <button type="button" data-lang="sv" lang="sv">SV</button><button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </div>
  <div class="landing-body">
    <h1 id="landTitle" data-i18n="land.title"></h1>
    <p class="land-lead" data-i18n="land.lead"></p>
    <div id="landingSearch">
      <form id="search" class="search" autocomplete="off">
        <label for="q" class="visually-hidden" data-i18n="search.label"></label>
        <input id="q" type="search" data-i18n-placeholder="search.placeholder" required>
        <button type="submit" data-i18n-aria="search.button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        </button>
      </form>
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </div>
    <p class="land-note" id="landNote" data-i18n="land.note"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="i18n.js?v=20260925m"></script>
<script src="refdata.js?v=20260925m"></script>
<script src="app.js?v=20260925m"></script>
</body>
</html>
